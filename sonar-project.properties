# SonarCloud configuration

sonar.organization=weirdapps
sonar.projectKey=weirdapps_sw-utils
sonar.projectName=sw-utils

# Source code location
#
# Deliberately narrowed to the code, not the repo root. data/ alone holds over
# half a million lines of committed SWGOH game-state JSON (game_presets_*.json
# is 280k and 220k lines), and Sonar counts JSON as ncloc. Pointing sources at
# the root would bill all of it and analyse none of it usefully.
sonar.sources=farmbot,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.14

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions. coverage.xml is written by pytest-cov during the job, before the
# scanner runs, so leaving it in sources bills a regenerated, untracked file.
sonar.exclusions=\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  coverage.xml,\
  **/coverage.xml,\
  .github/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
